<table class="table">
    <thead class="table-dark">
        <tr>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Email</th>
            <th>Sales Volume</th>
            <th>Met Quota?</th>
        </tr>
    </thead>

    <!-- Special Angular Directive: *ngFor -->
    <tbody>
        <tr *ngFor="let tmpSalesPerson of salesPersonList" [ngClass]="{'highlight': tmpSalesPerson.salesVolume >= 60000}">
            <td>{{ tmpSalesPerson.firstName }}</td>
            <td>{{ tmpSalesPerson.lastName }}</td>
            <td>{{ tmpSalesPerson.email }}</td>
            <td>{{ tmpSalesPerson.salesVolume | currency:'USD' }}</td>
            <td>
                <div *ngIf="tmpSalesPerson.salesVolume >= 60000; else myElseBlock">YES</div>
                <ng-template #myElseBlock>NO</ng-template>
            </td>
        </tr>
    </tbody>
</table>
